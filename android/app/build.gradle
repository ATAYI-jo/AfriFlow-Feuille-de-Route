plugins { id 'com.android.application' }
android {
    namespace 'africa.afriflow.app'
    compileSdk 35
    defaultConfig {
        applicationId 'africa.afriflow.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
// Native notifications require Firebase. Never publish an APK with push silently disabled.
if (!file('google-services.json').exists()) {
    throw new GradleException('AfriFloW Android: google-services.json missing. Configure AFRIFLOW_FIREBASE_GOOGLE_SERVICES_JSON_B64 in GitHub Actions before building.')
}
apply plugin: 'com.google.gms.google-services'
