<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5d3a">
<title>AfriFlow — Hors ligne</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fcfbfa;color:#20382b;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,440px);padding:32px;border:1px solid #d9e5dd;border-radius:24px;background:white;box-shadow:0 10px 40px #1f5d3a0c}h1{font-size:26px;margin:12px 0}p{line-height:1.55}button{font:inherit;background:#1f5d3a;color:white;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}small{display:block;margin-top:20px;color:#526a5a}svg{color:#1f5d3a}
</style>
</head>
<body><main>
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16a5 5 0 0 1 7 0M2 8a15 15 0 0 1 3-2M10 4a15 15 0 0 1 12 4M12 20h.01"/></svg>
<h1>AfriFlow hors ligne</h1>
<p>La connexion au serveur est interrompue. Les espaces privés et opérations nécessitant le serveur ne sont pas accessibles sur cet écran.</p>
<p id="status" role="status" aria-live="polite">Reconnexion automatique dès que le serveur répond.</p>
<button id="retry" type="button">Réessayer</button>
<small>Aucun envoi ni paiement n’est confirmé hors ligne.</small>
</main>
<script>
(function(){
 let busy=false;
 async function retry(){
  if(busy)return;busy=true;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),5000);
  try{
   const response=await fetch('./offline-health.txt',{cache:'no-store',credentials:'omit',signal:controller.signal});
   if(response.ok&&(await response.text()).trim()==='afriflow-online-v1'){
    document.getElementById('status').textContent='Connexion rétablie. Ouverture d’AfriFlow…';
    location.replace('./');return;
   }
  }catch(_){}finally{clearTimeout(timer);busy=false;}
 }
 window.addEventListener('online',retry);
 window.addEventListener('focus',retry);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)retry();});
 document.getElementById('retry').addEventListener('click',retry);
 setInterval(()=>{if(!document.hidden)retry();},15000);retry();
})();
</script></body></html>
