name: Build AfriFloW Android and Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-apps.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Android-APK-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Windows-EXE-test
          path: desktop/dist/AfriFloW-Windows-Setup.exe
          if-no-files-found: error
