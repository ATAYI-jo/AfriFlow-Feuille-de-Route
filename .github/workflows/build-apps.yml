name: Build AfriFloW Android and Windows
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-apps.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides an Android SDK.
      # Avoid setup-android v3 trying to install the obsolete 'tools' package.
      - name: Prepare installed Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Android-APK-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Windows-EXE-test
          path: desktop/dist/AfriFloW-Windows-Setup.exe
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AfriFloW-Android-APK-test
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: AfriFloW-Windows-EXE-test
          path: release/windows
      - name: Prepare release files
        run: |
          mv release/android/app-debug.apk release/AfriFloW-Android-test.apk
          mv release/windows/AfriFloW-Windows-Setup.exe release/AfriFloW-Windows-Setup.exe
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.1.0-beta release/AfriFloW-Android-test.apk release/AfriFloW-Windows-Setup.exe --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.0-beta release/AfriFloW-Android-test.apk release/AfriFloW-Windows-Setup.exe --prerelease --latest=false --title "AfriFloW applications - version test" --notes "Versions de test non validées. L'application charge le site AfriFloW en ligne. Sur Windows, installateur non signé. Sur Android, APK signé en mode debug. Les connexions OAuth, téléchargements, caméra et autres fonctions devront être vérifiés." --repo "${{ github.repository }}"
          fi
