name: Build AfriFloW Android and Windows
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'tools/generate_app_icons.py'
      - 'logo.png'
      - '.github/workflows/build-apps.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides an Android SDK.
      # Avoid setup-android v3 trying to install the obsolete 'tools' package.
      - name: Prepare installed Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate AfriFloW Android launcher icons
        run: |
          python -m pip install Pillow==11.3.0
          python tools/generate_app_icons.py
      - name: Configure Firebase for native Android notifications
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.AFRIFLOW_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
            echo "Firebase Android configuration supplied."
          else
            echo "::error::Firebase configuration missing: set AFRIFLOW_FIREBASE_GOOGLE_SERVICES_JSON_B64 in GitHub Actions secrets. Refusing to publish an APK that cannot register for native notifications."
            exit 1
          fi
      - name: Build installable test APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Android-APK-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate AfriFloW Windows icons
        run: |
          python -m pip install Pillow==11.3.0
          python tools/generate_app_icons.py
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AfriFloW-Windows-EXE-test
          path: |
            desktop/dist/AfriFloW-Windows-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AfriFloW-Android-APK-test
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: AfriFloW-Windows-EXE-test
          path: release/windows
      - name: Prepare release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          mv release/android/app-debug.apk release/AfriFloW-Android-test.apk
          test -f release/windows/AfriFloW-Windows-Setup.exe
          test -f release/windows/latest.yml
          cp release/windows/AfriFloW-Windows-Setup.exe release/AfriFloW-Windows-Setup.exe
          cp release/windows/latest.yml release/latest.yml
          find release/windows -name '*.blockmap' -exec cp {} release/ \\;
      - name: Publish versioned GitHub release for updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(release/AfriFloW-Android-test.apk release/AfriFloW-Windows-Setup.exe release/latest.yml)
          for file in release/*.blockmap; do
            if [ -f "$file" ]; then FILES+=("$file"); fi
          done
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" --latest --title "AfriFloW $RELEASE_TAG" --notes "Windows : mise à jour sans désinstallation depuis les versions compatibles avec electron-updater. Android : APK de test ; la continuité de signature doit être validée avant mise à jour par-dessus une ancienne APK."
          fi
