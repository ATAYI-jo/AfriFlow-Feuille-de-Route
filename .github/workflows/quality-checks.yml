name: AfriFloW - Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afriflow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-regression:
    name: JavaScript syntax and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and critical module wiring
        run: node --test tests/*.test.cjs
